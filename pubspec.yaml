name: mfb_think_tank
description: "MFB Think Tank - find the signal in the noise."
publish_to: 'none'
version: 0.2.2+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  http: ^1.6.0
  material_ui: ^1.6.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mock_exceptions: ^0.8.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf

# Launcher icons. Sources in assets/icon/ are not bundled (only assets/brand/
# is). Regenerate after changing them: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#0a0d14"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
