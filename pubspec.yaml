name: mfb_think_tank
description: "MFB Think Tank - Flutter app with Firebase Auth."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  material_ui: ^1.6.0
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  fake_async: ^1.3.3
  firebase_auth_mocks: ^0.15.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mock_exceptions: ^0.8.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
