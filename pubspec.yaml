name: mfb_think_tank
description: "MFB Think Tank - Flutter app with Firebase Auth."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  material_ui: ^1.6.0
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  firebase_auth_mocks: ^0.15.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mock_exceptions: ^0.8.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
